apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ws-bridge.fullname" . }}
  labels:
    {{- include "ws-bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ws-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ws-bridge.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ws-bridge.fullname" . }}
      containers:
        - name: ws-bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["deno", "run", "--allow-net", "--allow-env", "/app/main.ts"]
          env:
            - name: PORT
              value: "8080"
            - name: MINECRAFT_HOST
              value: {{ .Values.minecraft.host | quote }}
            - name: MINECRAFT_PORT
              value: {{ .Values.minecraft.port | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: server-script
              mountPath: /app
      volumes:
        - name: server-script
          configMap:
            name: {{ include "ws-bridge.fullname" . }}-script
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
